name: PR Guard

on:
  pull_request:
    branches: [ main ]

jobs:
  check-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require basic site files
        run: |
          test -f index.html
          test -f ./en/index.html
          test -f ./zh/index.html
