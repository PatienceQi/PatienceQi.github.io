name: Enable auto-merge for Codex PRs

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    # Auto-enable for branches created by Codex (prefix) or when the "automerge" label is present
    if: |
      startsWith(github.event.pull_request.head.ref, 'codex/') ||
      contains(join(github.event.pull_request.labels.*.name), 'automerge')
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (squash)
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash
